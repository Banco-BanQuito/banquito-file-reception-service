spring.application.name=${SPRING_APPLICATION_NAME:banquito-file-reception-service}
spring.config.import=${SPRING_CONFIG_IMPORT:optional:file:.env[.properties]}
server.port=${SERVER_PORT:8084}

app.file-reception.duplicate-window-days=${APP_DUPLICATE_WINDOW_DAYS:30}
app.file-reception.file-delimiter=${APP_FILE_DELIMITER:,}
app.file-reception.embedded-router-enabled=${APP_EMBEDDED_ROUTER_ENABLED:true}
app.file-reception.dispatch-enabled=${APP_DISPATCH_ENABLED:true}
app.file-reception.dispatch-on-us-enabled=${APP_DISPATCH_ONUS_ENABLED:true}
app.file-reception.dispatch-off-us-enabled=${APP_DISPATCH_OFFUS_ENABLED:true}
app.file-reception.dispatch-invalid-enabled=${APP_DISPATCH_INVALID_ENABLED:true}
app.file-reception.tariff-grpc-host=${TARIFF_SERVICE_GRPC_HOST}
app.file-reception.tariff-grpc-port=${TARIFF_SERVICE_GRPC_PORT:9090}
app.file-reception.notification-grpc-host=${NOTIFICATION_SERVICE_GRPC_HOST}
app.file-reception.notification-grpc-port=${NOTIFICATION_SERVICE_GRPC_PORT:9092}
app.file-reception.grpc-deadline-seconds=${APP_GRPC_DEADLINE_SECONDS:10}
app.file-reception.cutoff-hour=${APP_CUTOFF_HOUR:23}
app.file-reception.core-base-url=${CORE_GATEWAY_URL}
app.file-reception.core-holiday-endpoint=${CORE_HOLIDAY_ENDPOINT:/api/v2/calendar/holidays/check}
app.file-reception.core-account-validation-endpoint=${CORE_ACCOUNT_VALIDATION_ENDPOINT:/api/v1/accounts/validate}
app.file-reception.core-favorite-account-endpoint=${CORE_FAVORITE_ACCOUNT_ENDPOINT:/api/v2/accounts/customer/{customerId}/favorite}
app.file-reception.core-mass-payment-service-endpoint=${CORE_MASS_PAYMENT_SERVICE_ENDPOINT:/api/v1/customers/mass-payments/active}
app.file-reception.core-batch-credit-endpoint=${CORE_BATCH_CREDIT_ENDPOINT:/api/v2/payments/batch-credit}
app.file-reception.core-corporate-debit-endpoint=${CORE_CORPORATE_DEBIT_ENDPOINT:/api/v2/payments/corporate-debit}
app.file-reception.core-corporate-refund-endpoint=${CORE_CORPORATE_REFUND_ENDPOINT:/api/v2/payments/corporate-refund}
app.file-reception.core-validation-enabled=${APP_CORE_VALIDATION_ENABLED:true}
app.file-reception.force-business-day=${APP_FORCE_BUSINESS_DAY:false}
app.file-reception.corporate-account-number=${CORPORATE_ACCOUNT_NUMBER:0000000000}
app.file-reception.dispatch-local-completion-enabled=${DISPATCH_LOCAL_COMPLETION_ENABLED:false}
app.file-reception.pubsub-project-id=${PUBSUB_PROJECT_ID:${GCP_PROJECT_ID}}
app.file-reception.pubsub-payment-lines-topic=${PUBSUB_TOPIC_PAYMENT_LINES:banquito-payment-lines}
app.file-reception.pubsub-clearing-events-topic=${PUBSUB_TOPIC_CLEARING_EVENTS:banquito-clearing-events}
app.file-reception.pubsub-payment-lines-on-us-subscription=${PUBSUB_SUBSCRIPTION_PAYMENT_LINES_ONUS:payment-lines-onus-sub}
app.file-reception.pubsub-payment-lines-off-us-subscription=${PUBSUB_SUBSCRIPTION_PAYMENT_LINES_OFFUS:payment-lines-offus-sub}
app.file-reception.pubsub-payment-lines-invalid-subscription=${PUBSUB_SUBSCRIPTION_PAYMENT_LINES_INVALID:payment-lines-invalid-sub}
app.file-reception.pubsub-routing-key-on-us=${PUBSUB_ROUTING_KEY_ONUS:onus}
app.file-reception.pubsub-routing-key-off-us=${PUBSUB_ROUTING_KEY_OFFUS:offus}
app.file-reception.pubsub-routing-key-invalid=${PUBSUB_ROUTING_KEY_INVALID:invalid}
app.file-reception.pubsub-routing-key-clearing-outbound=${PUBSUB_ROUTING_KEY_CLEARING_OUTBOUND:clearing.outbound}
# Fase 5 Parte 2 (TAREA B): gRPC directo hacia clearinghouse-service, reemplazando la
# publicacion Pub/Sub legacy de processOffUsLine (banquito-clearing-events sin consumidor activo).
app.file-reception.clearinghouse-grpc-host=${CLEARINGHOUSE_GRPC_HOST:localhost}
app.file-reception.clearinghouse-grpc-port=${CLEARINGHOUSE_GRPC_PORT:9094}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASS}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.data.mongodb.uri=${MONGO_URI}
spring.mongodb.uri=${MONGO_URI}
spring.data.mongodb.auto-index-creation=true

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
management.endpoint.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES_ENABLED:true}
management.endpoint.health.show-details=always
management.health.mongodb.enabled=${MANAGEMENT_HEALTH_MONGO_ENABLED:false}

