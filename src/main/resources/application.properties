spring.application.name=${SPRING_APPLICATION_NAME:banquito-file-reception-service}
spring.config.import=${SPRING_CONFIG_IMPORT:optional:file:.env[.properties]}
server.port=${SERVER_PORT:8084}

app.file-reception.duplicate-window-days=${APP_DUPLICATE_WINDOW_DAYS:30}
app.file-reception.file-delimiter=${APP_FILE_DELIMITER:,}
app.file-reception.rabbit-enabled=${APP_RABBIT_ENABLED:true}
app.file-reception.rabbit-queue-onus=${APP_RABBIT_QUEUE_ONUS:payment.lines.onus.queue}
app.file-reception.rabbit-queue-offus=${APP_RABBIT_QUEUE_OFFUS:payment.lines.offus.queue}
app.file-reception.rabbit-queue-invalid=${APP_RABBIT_QUEUE_INVALID:payment.lines.invalid.queue}
app.file-reception.tariff-grpc-host=${TARIFF_SERVICE_GRPC_HOST:localhost}
app.file-reception.tariff-grpc-port=${TARIFF_SERVICE_GRPC_PORT:9090}
app.file-reception.notification-grpc-host=${NOTIFICATION_SERVICE_GRPC_HOST:localhost}
app.file-reception.notification-grpc-port=${NOTIFICATION_SERVICE_GRPC_PORT:9092}
app.file-reception.grpc-deadline-seconds=${APP_GRPC_DEADLINE_SECONDS:10}
app.file-reception.cutoff-hour=${APP_CUTOFF_HOUR:18}
app.file-reception.core-base-url=${CORE_GATEWAY_URL:http://localhost:8080}
app.file-reception.core-holiday-endpoint=${CORE_HOLIDAY_ENDPOINT:/api/v2/calendar/holidays/check}
app.file-reception.core-account-validation-endpoint=${CORE_ACCOUNT_VALIDATION_ENDPOINT:/api/v1/accounts/validate}
app.file-reception.core-favorite-account-endpoint=${CORE_FAVORITE_ACCOUNT_ENDPOINT:/api/v2/accounts/customer/{customerId}/favorite}
app.file-reception.core-mass-payment-service-endpoint=${CORE_MASS_PAYMENT_SERVICE_ENDPOINT:/api/v1/customers/mass-payments/active}
app.file-reception.core-batch-credit-endpoint=${CORE_BATCH_CREDIT_ENDPOINT:/api/v2/payments/batch-credit}
app.file-reception.core-corporate-debit-endpoint=${CORE_CORPORATE_DEBIT_ENDPOINT:/api/v2/payments/corporate-debit}
app.file-reception.core-corporate-refund-endpoint=${CORE_CORPORATE_REFUND_ENDPOINT:/api/v2/payments/corporate-refund}
app.file-reception.core-validation-enabled=${APP_CORE_VALIDATION_ENABLED:true}
app.file-reception.force-business-day=${APP_FORCE_BUSINESS_DAY:false}
app.file-reception.corporate-account-number=${CORPORATE_ACCOUNT_NUMBER:0000000000}
app.file-reception.dispatch-local-completion-enabled=${DISPATCH_LOCAL_COMPLETION_ENABLED:false}
app.file-reception.clearing-exchange=${RABBITMQ_CLEARING_EXCHANGE:clearing.exchange}
app.file-reception.clearing-routing-key=${RABBITMQ_CLEARING_ROUTING_KEY:clearing.outbound}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/filedb?useSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=${JPA_OPEN_IN_VIEW:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.data.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/file_reception}
spring.mongodb.uri=${MONGO_URI:mongodb://localhost:27017/file_reception}

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.virtual-host=${RABBITMQ_VHOST:/}

spring.servlet.multipart.max-file-size=${MAX_FILE_SIZE:10MB}
spring.servlet.multipart.max-request-size=${MAX_REQUEST_SIZE:10MB}

management.endpoints.web.exposure.include=${MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE:health,info,metrics,prometheus}
management.endpoint.health.probes.enabled=${MANAGEMENT_HEALTH_PROBES_ENABLED:true}
management.health.rabbit.enabled=${MANAGEMENT_HEALTH_RABBIT_ENABLED:false}
management.health.mongo.enabled=${MANAGEMENT_HEALTH_MONGO_ENABLED:false}
